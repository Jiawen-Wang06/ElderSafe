name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION: ElderSafe.slnx

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      # Indentation, trailing whitespace and final newlines, per .editorconfig.
      - name: Check formatting
        run: dotnet format whitespace ${{ env.SOLUTION }} --verify-no-changes --no-restore --exclude src/ElderSafe.Api/Migrations

      # Code-style rules set to error in .editorconfig, which is where the
      # braces rule (IDE0011) is enforced.
      - name: Check code style
        run: dotnet format style ${{ env.SOLUTION }} --verify-no-changes --severity error --no-restore --exclude src/ElderSafe.Api/Migrations

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      # --no-build guarantees the tests run against the binaries just built,
      # rather than quietly rebuilding something slightly different.
      - name: Run tests
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts

      # always() so results are kept when tests fail, which is exactly when
      # they are worth reading. These .trx files are also what
      # tools/generate_traceability.py reads to build the traceability matrix.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/**/*.trx
          if-no-files-found: error

  traceability:
    name: Traceability
    runs-on: ubuntu-latest
    needs: [test, dashboard]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The matrix must describe the run that produced the results, not a
      # fresh run that might differ.
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: artifacts

      - name: Download dashboard test results
        uses: actions/download-artifact@v4
        with:
          name: dashboard-test-results
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --check fails the job if any requirement is neither verified by a
      # passing test nor marked deferred in the requirements document, or if
      # a test names a requirement that does not exist. pipefail keeps that
      # exit code through the tee.
      - name: Generate and check the traceability matrix
        shell: bash
        run: |
          set -o pipefail
          python tools/generate_traceability.py \
            --results artifacts \
            --out artifacts/traceability.md \
            --check \
            | tee artifacts/summary.txt

      - name: Publish the summary
        if: always()
        run: |
          echo "## Requirements traceability" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/traceability.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the traceability matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: artifacts/traceability.md
  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ElderSafe.Dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ElderSafe.Dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

      # Separate from the `npm test` gate above: this run's only purpose is
      # producing JUnit XML for tools/generate_traceability.py, which traces
      # REQ-CFG-09's coverage (the only requirement currently verified on
      # the frontend rather than the API) into the same matrix as the
      # backend's .trx results.
      - name: Run tests with JUnit output for traceability
        if: always()
        run: npm run test:junit

      - name: Upload dashboard test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-test-results
          path: artifacts/vitest-results.xml
          if-no-files-found: error
