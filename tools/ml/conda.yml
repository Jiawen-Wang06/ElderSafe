name: eldersafe-fall
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      # Pinned to the versions the local run used, so an Azure ML run
      # reproduces the local metrics exactly.
      - numpy==2.5.5
      - scipy==1.18.1
      - scikit-learn==1.9.1
      - lightgbm==4.7.0
      - onnx==1.23.2
      - onnxmltools==1.16.0
      - onnxruntime==1.32.0
      - mlflow==3.18.0
      - azureml-mlflow==1.62.0.post7
